name: Update Jobs Feed Daily

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 7am CST (UTC-6) every weekday
  workflow_dispatch:           # also allows manual trigger from GitHub

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to commit jobs.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Apify job scraper
        run: |
          curl -s -X POST \
            "https://api.apify.com/v2/acts/${{ secrets.APIFY_ACTOR_ID }}/runs?token=${{ secrets.APIFY_API_TOKEN }}&waitForFinish=300" \
            -H "Content-Type: application/json" \
            -d '{
              "maxJobsPerFeed": 200,
              "includeAiFields": true,
              "titleSearch": ["SOC Analyst","GRC Analyst","IAM Analyst","Security Analyst","Data Analyst"],
              "titleExclusionSearch": ["Warehouse","Administrative","Coordinator","Patient","Driver","Sales","Intern","Seasonal"],
              "locationSearch": ["United States"]
            }' \
            -o /dev/null
          echo "Apify run triggered and completed"

      - name: Process jobs and update jobs.json
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_ACTOR_ID:  ${{ secrets.APIFY_ACTOR_ID }}
        run: python process_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "Job Bot 🤖"
          git config user.email "bot@shamika.jobs"
          git add jobs.json
          git diff --staged --quiet || git commit -m "🔄 Auto-update jobs — $(date '+%Y-%m-%d %H:%M CST')"
          git push
