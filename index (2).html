<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --panel2:#273449; --text:#e2e8f0;
  --muted:#94a3b8; --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --border:#334155;
}
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
header { padding:24px 32px; background:linear-gradient(135deg,#0ea5e9,#6366f1); }
header h1 { margin:0 0 4px; font-size:24px; }
header p { margin:0; color:#e0f2fe; font-size:13px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; padding:20px 32px; background:var(--panel); border-bottom:1px solid var(--border); }
.stat { background:var(--panel2); padding:14px 16px; border-radius:8px; border:1px solid var(--border); }
.stat .v { font-size:24px; font-weight:700; color:var(--accent); }
.stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
.controls { padding:16px 32px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.controls input, .controls select { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:14px; }
.controls input { flex:1; min-width:200px; }
.controls label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
main { padding:20px 32px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px; transition:transform .15s, border-color .15s; }
.card:hover { transform:translateY(-2px); border-color:var(--accent); }
.card h3 { margin:0; font-size:16px; line-height:1.3; }
.meta { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:2px; }
.meta .row { display:flex; gap:6px; align-items:center; }
.score-bar { height:6px; background:var(--panel2); border-radius:4px; overflow:hidden; }
.score-bar > div { height:100%; background:linear-gradient(90deg,#22c55e,#38bdf8); }
.score-label { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
.flags { display:flex; flex-wrap:wrap; gap:6px; }
.flag { font-size:11px; padding:3px 8px; border-radius:12px; font-weight:600; letter-spacing:.3px; }
.flag.good { background:rgba(34,197,94,.15); color:#86efac; border:1px solid rgba(34,197,94,.4); }
.flag.warn { background:rgba(245,158,11,.15); color:#fcd34d; border:1px solid rgba(245,158,11,.4); }
.flag.bad { background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.4); }
.flag.muted { background:var(--panel2); color:var(--muted); border:1px solid var(--border); }
.apply { margin-top:auto; display:inline-block; text-align:center; padding:10px 14px; background:var(--accent); color:#0c1322; text-decoration:none; border-radius:6px; font-weight:600; font-size:14px; }
.apply:hover { background:#7dd3fc; }
.empty { text-align:center; color:var(--muted); padding:40px; }
.footer { padding:16px 32px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function flagPill(label, val, goodWhen) {
  const cls = val === goodWhen ? "good" : "bad";
  return `<span class="flag ${cls}">${esc(label)}: ${esc(val)}</span>`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase().trim();
  const onlyH4 = document.getElementById("onlyH4").checked;
  const hideClr = document.getElementById("hideClr").checked;
  const min = parseInt(document.getElementById("minScore").value, 10);
  const sortBy = document.getElementById("sort").value;

  let list = JOBS.filter(j => {
    if (j.score < min) return false;
    if (onlyH4 && j.h4_ead_compatible !== "yes") return false;
    if (hideClr && j.clearance_required === "yes") return false;
    if (q) {
      const hay = (j.title + " " + j.company + " " + j.location + " " + (j.skills||[]).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (sortBy === "score") list.sort((a,b) => b.score - a.score);
  else if (sortBy === "posted") list.sort((a,b) => (b.posted||"").localeCompare(a.posted||""));
  else if (sortBy === "company") list.sort((a,b) => (a.company||"").localeCompare(b.company||""));

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  if (!list.length) { grid.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";

  grid.innerHTML = list.map(j => {
    const remoteFlag = j.remote ? '<span class="flag good">Remote</span>' : '';
    const salaryRow = j.salary ? `<div class="row">${esc(j.salary)}</div>` : '';
    return `
      <article class="card">
        <h3>${esc(j.title)}</h3>
        <div class="meta">
          <div class="row"><strong>${esc(j.company)}</strong></div>
          <div class="row">${esc(j.location)}</div>
          ${salaryRow}
        </div>
        <div class="score-label"><span>Match Score</span><span>${j.score}/100</span></div>
        <div class="score-bar"><div style="width:${j.score}%"></div></div>
        <div class="flags">
          ${flagPill("H4-EAD", j.h4_ead_compatible, "yes")}
          ${flagPill("Clearance", j.clearance_required, "no")}
          ${flagPill("Citizenship", j.citizenship_required, "no")}
          ${remoteFlag}
        </div>
        <a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener">Apply →</a>
      </article>`;
  }).join("");
}

["q","onlyH4","hideClr","minScore","sort"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
render();
</script>
